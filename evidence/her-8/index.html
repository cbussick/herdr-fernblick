<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HER-8 · iPad portrait layout comparison</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6; }
  body { margin: 0 auto; max-width: 1800px; padding: 1.5rem; }
  h1 { margin-bottom: .3rem; } p { color: #cbd5e1; }
  section { margin-block: 2.5rem; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
  figure { margin: 0; min-width: 0; } figcaption { padding: .7rem 0; font-weight: 700; }
  img { display: block; width: 100%; height: auto; border: 1px solid #475569; border-radius: .5rem; }
  @media (max-width: 850px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>HER-8 · iPad portrait</h1>
<p>Playwright captures at 1× pixel density with a synthetic demo agent and conversation. Portrait now gives chat the full width; landscape retains the two-column layout. Phone remains single-pane.</p>
<section><h2>iPad portrait · 820 × 1180</h2><div class="pair"><figure><figcaption>Before · 420px chat</figcaption><img src="before-ipad-portrait.png" alt="Before: narrow chat beside session list on portrait iPad"></figure><figure><figcaption>After · 820px chat</figcaption><img src="after-ipad-portrait.png" alt="After: full-width chat on portrait iPad"></figure></div></section>
<section><h2>iPad landscape · 1180 × 820</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="before-ipad-landscape.png" alt="Before: two-column landscape layout"></figure><figure><figcaption>After · unchanged</figcaption><img src="after-ipad-landscape.png" alt="After: two-column landscape layout"></figure></div></section>
<section><h2>Phone · 390 × 844</h2><div class="pair"><figure><figcaption>Before</figcaption><img src="before-phone.png" alt="Before: full-width phone chat"></figure><figure><figcaption>After · unchanged</figcaption><img src="after-phone.png" alt="After: full-width phone chat"></figure></div></section>
</body>
</html>
