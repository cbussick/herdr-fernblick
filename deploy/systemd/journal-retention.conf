# Only the fernblick journal namespace, NOT the shared host journal.
# Install as /etc/systemd/journald@fernblick.conf.d/retention.conf
[Journal]
Storage=persistent
SystemMaxUse=100M
SystemMaxFileSize=10M
SystemKeepFree=1G
RuntimeMaxUse=16M
MaxRetentionSec=7day
MaxFileSec=1day
RateLimitIntervalSec=30s
RateLimitBurst=100
